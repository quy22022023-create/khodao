<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CODE EDITOR LITE">
    <meta name="theme-color" content="#000000">
    

    <title>CODE EDITOR LITE</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/selection/active-line.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <input type="file" id="file-input" multiple hidden onchange="importFiles(event)">
    <input type="file" id="folder-input" webkitdirectory directory multiple hidden onchange="importFiles(event, true)">
    <input type="file" id="zip-input" accept=".zip,application/zip" hidden onchange="importZipProject(event)">
    <header class="header">
        <div class="header-top">
            <button class="btn-icon" id="btn-toggle-tree" onclick="toggleTree()" aria-label="Ẩn/hiện cây thư mục" aria-controls="project-sidebar" aria-expanded="true"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
            <h1>CODE EDITOR <span>LITE</span></h1>
            <button class="btn-run" onclick="runCode()"><i class="fa-solid fa-play" aria-hidden="true"></i> RUN</button>
        </div>
    </header>
    <main class="main-content">
        <aside id="project-sidebar" aria-label="Dự án">
            <div class="sidebar-heading"><strong>DỰ ÁN</strong><span id="file-count"></span></div>
            <label class="search-box"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="project-search" type="search" placeholder="Tìm tên / nội dung code…" aria-label="Tìm toàn dự án" autocomplete="off" spellcheck="false"></label>
            <div class="tree-actions">
                <button onclick="addNewFile()" title="Tạo file"><i class="fa-solid fa-file-circle-plus" aria-hidden="true"></i> File</button>
                <button onclick="addNewFolder()" title="Tạo thư mục"><i class="fa-solid fa-folder-plus" aria-hidden="true"></i> Thư mục</button>
                <button onclick="renameSelected()" title="Đổi tên mục đã chọn" aria-label="Đổi tên"><i class="fa-solid fa-pen" aria-hidden="true"></i></button>
                <button onclick="deleteSelected()" class="text-danger" title="Xóa mục đã chọn" aria-label="Xóa file hoặc thư mục"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
            </div>
            <button id="project-root" class="root-row" onclick="selectRoot()">/ Dự án</button>
            <div id="file-tree" role="tree" aria-label="Cây thư mục"></div>
            <div class="project-io">
                <div class="io-buttons">
                    <button onclick="document.getElementById('file-input').click()">Nhập file</button>
                    <button id="btn-import-folder" onclick="openFolderPicker()">Nhập thư mục</button>
                    <button onclick="document.getElementById('zip-input').click()">Nhập ZIP</button>
                    <button onclick="exportProjectZip()">Xuất ZIP</button>
                </div>
                <p class="import-destination" id="import-destination"></p>
                <label class="import-option"><input type="checkbox" id="import-overwrite" aria-describedby="import-help"> Cho phép ghi đè file trùng đường dẫn</label>
                <label class="import-option"><input type="checkbox" id="import-keep-root" checked> Giữ tên thư mục gốc khi nhập thư mục</label>
                <p class="import-help" id="import-help">Nhập file, thư mục và ZIP sẽ gộp vào vị trí đang chọn. Khi tắt ghi đè, file trùng được bỏ qua. Chỉ cập nhật bản sao trong ứng dụng.</p>
                <p class="import-result" id="import-result" role="status" aria-live="polite" hidden></p>
            </div>
        </aside>
        <section class="editor-pane" aria-label="Soạn thảo">
            <div class="file-heading"><span id="current-path">Chưa mở file</span><span id="save-status" role="status">Đang tải…</span></div>
            <div class="editor-wrapper"><textarea id="code-editor" aria-label="Nội dung code"></textarea><div id="editor-empty" hidden>Chọn hoặc tạo file trong cây thư mục.</div></div>
            <div class="editor-toolbar" aria-label="Thao tác code">
                <div class="code-actions">
                    <button id="btn-paste" onclick="pasteFromClipboard()">DÁN</button>
                    <button id="btn-copy" onclick="copyAllCode()">SAO CHÉP TOÀN BỘ FILE</button>
                    <button id="btn-clear" class="text-danger" onclick="clearCurrentCode()">XÓA SẠCH CODE</button>
                </div>
                <div class="keyboard-bar">
                    <button class="key-btn" onclick="undoCode()" aria-label="Hoàn tác" title="Undo"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
                    <button class="key-btn" onclick="redoCode()" aria-label="Làm lại" title="Redo"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
                    <button class="key-btn" onclick="insertText('Tab')">Tab</button>
                    <button class="key-btn" onclick="insertText('{')">{</button><button class="key-btn" onclick="insertText('}')">}</button>
                    <button class="key-btn" onclick="insertText('&lt;')">&lt;</button><button class="key-btn" onclick="insertText('&gt;')">&gt;</button>
                </div>
            </div>
        </section>
    </main>
    <section id="preview-overlay" aria-label="Xem trước HTML" hidden>
        <div class="preview-header"><span class="preview-title" id="preview-title">Xem trước</span><button onclick="closePreview()">Đóng ✕</button></div>
        <div id="iframe-container"><iframe id="preview" title="Kết quả chạy HTML" sandbox="allow-scripts allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer"></iframe></div>
    </section>
    <div id="toast-notification" class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
</body>
</html>
